<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiteCheck — Facility Ops</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<style>
:root{
  --paper:#F2EFE9; --card:#FBFAF6; --ink:#1A1D21; --steel:#5A6470; --muted:#8C8578;
  --hazard:#E8590C; --hazard-d:#C24806; --ok:#1F6F54; --ok-bg:#EAF5F0; --alert:#C0392B; --alert-bg:#FBEAE7;
  --line:#DED8CB; --line2:#E9E4D8; --info-bg:#E6F1FB; --info:#0C447C;
  --shadow:0 1px 2px rgba(26,29,33,.06),0 4px 16px rgba(26,29,33,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
  background:repeating-linear-gradient(0deg,transparent 0 38px,rgba(0,0,0,.012) 38px 39px),var(--paper);min-height:100vh}
button{font-family:inherit;cursor:pointer}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;background:rgba(242,239,233,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:.3px;text-transform:uppercase}
.bm{width:30px;height:30px;border-radius:7px;background:var(--ink);color:var(--hazard);display:grid;place-items:center;font-size:16px}
.topright{display:flex;align-items:center;gap:9px}
.main{max-width:760px;margin:0 auto;padding:18px 16px 70px}
.loading{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--steel);padding:60px 0;font-weight:600}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--hazard);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin.big{width:26px;height:26px}@keyframes sp{to{transform:rotate(360deg)}}
h3{font-weight:700;font-size:24px;margin:6px 0 4px}h4{font-weight:600;font-size:17px;margin:0}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--steel)}.hint{color:var(--steel);font-size:13px;margin:0 0 8px;line-height:1.5}
.lead{margin:0 0 12px;line-height:1.5}
.label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--steel);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
input[type=text],input[type=password],textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--hazard)}
textarea{resize:vertical;line-height:1.45}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:9px 13px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--steel)}.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-dark{background:var(--ink);color:#fff;border-color:var(--ink)}.btn-dark:hover:not(:disabled){background:#000}
.btn-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn-danger{color:var(--alert)}.btn-danger:hover:not(:disabled){border-color:var(--alert)}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--steel)}
.icon-btn.danger:hover{border-color:var(--alert);color:var(--alert)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin-top:12px}.kv span:nth-child(odd){color:var(--steel);font-weight:600}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--steel)}
.tabs .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.frow:hover{border-color:var(--ink)}
.fi{width:38px;height:38px;border-radius:9px;background:var(--line2);display:grid;place-items:center;color:var(--ink);font-size:19px;flex-shrink:0}
.fname{font-weight:600;font-size:17px}.faddr{color:var(--steel);font-size:12.5px}
.fbody{flex:1;display:flex;flex-direction:column;min-width:0}
.fmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.fcard{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);flex-wrap:wrap}
.fc-actions{display:flex;gap:8px;align-items:center}
.chip{font-family:ui-monospace,monospace;font-weight:600;background:var(--ink);color:#fff;padding:5px 9px;border-radius:7px;font-size:14px}
.chip.sm{font-size:12px;padding:3px 7px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:20px;background:var(--line2);color:var(--steel)}
.pill.today{background:#FBEFE5;color:var(--hazard-d)}.pill.you{background:var(--info-bg);color:var(--info)}
.you-badge{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--info-bg);color:var(--info);vertical-align:middle}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.section .sh{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;font-size:14px;color:#fff;border-radius:12px 12px 0 0}
.section .sb{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:6px 14px 12px;background:var(--card)}
.lrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line2)}.lrow:last-child{border-bottom:0}
.locknum{display:flex;align-items:center;gap:7px}.locknum input{width:80px;text-align:center;letter-spacing:3px;font-family:ui-monospace,monospace;font-size:16px}
.check{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;font-weight:500;background:#fff;color:var(--ink)}
.check.full{width:100%;margin-top:8px}
.check .bx{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:12px;flex-shrink:0}
.check.on{border-color:var(--ok);background:var(--ok-bg)}.check.on .bx{background:var(--ok);border-color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:#fff;border:0;border-right:1px solid var(--line);padding:9px 15px;font-weight:600;font-size:14px;color:var(--steel)}
.seg button:last-child{border-right:0}.seg .y{background:var(--hazard);color:#fff}.seg .n{background:var(--ok);color:#fff}
.cond{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}
.cond button{flex:1;min-width:150px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;font-weight:600;font-size:14px;color:var(--steel)}
.cond .ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}.cond .bad{border-color:var(--alert);background:var(--alert-bg);color:var(--alert)}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line2)}.qrow:last-of-type{border-bottom:0}.qrow span{flex:1;min-width:170px;font-weight:500}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;border:1px solid var(--line)}.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .xx{position:absolute;top:3px;right:3px;width:20px;height:20px;border:0;background:rgba(26,29,33,.78);color:#fff;border-radius:5px;display:grid;place-items:center;font-size:13px}
.addph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1.5px dashed var(--line);border-radius:9px;font-size:11px;font-weight:600;color:var(--steel);aspect-ratio:1;background:#fff}
.count{font-family:ui-monospace,monospace;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;margin-left:auto}
.count.ok{background:var(--ok-bg);color:var(--ok)}.count.need{background:#FBEFE5;color:var(--hazard-d)}
.notice{display:flex;gap:9px;align-items:center;background:#FBEFE5;border:1px solid #F2CBA8;color:var(--hazard-d);padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.4}
.empty{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:11px;padding:24px;font-size:14px;text-align:center}
.errbar{display:flex;align-items:center;gap:8px;background:var(--alert-bg);border:1px solid #F0C2BB;color:var(--alert);padding:10px 13px;border-radius:10px;font-size:13px;font-weight:500;margin-top:10px}
.pips{display:flex;gap:5px;margin:12px 0 8px;flex-wrap:wrap}
.pip{flex:1;min-width:30px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:15px;color:var(--muted)}
.pip small{font-family:ui-monospace,monospace;font-size:10px}.pip.on{background:var(--hazard);border-color:var(--hazard);color:#fff}.pip.done{background:var(--line2);color:var(--ink);border-color:var(--line)}
.wo{background:var(--ink);color:#fff;border-radius:13px;padding:15px;margin-bottom:14px}
.wo .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px;color:var(--hazard);text-transform:uppercase}
.wo h4{font-size:22px;margin-top:3px}.wo .cur{font-weight:700;text-transform:uppercase;letter-spacing:1.2px;font-size:13px;color:var(--hazard)}
.wo .chip{background:rgba(255,255,255,.12)}
.navb{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:11px 0;background:linear-gradient(transparent,var(--paper) 28%)}
.nc{font-family:ui-monospace,monospace;font-size:13px;color:var(--steel)}
.review-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-weight:600;font-size:14px}
.review-row .v{color:var(--steel);font-weight:500;font-size:13px}
.done{text-align:center;padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.done .di{font-size:54px;color:var(--ok)}
.litem{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.addline{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:none;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--steel)}
.addline:hover{border-color:var(--hazard);color:var(--hazard-d)}
.assign{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line2)}.assign:last-child{border-bottom:0}.assign select{max-width:160px}
.note{background:var(--line2);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--steel)}
.saved{display:flex;align-items:center;gap:7px;justify-content:center;color:var(--ok);font-size:13px;font-weight:600;padding:4px}
.login{max-width:380px;margin:26px auto 0}
.login-head{text-align:center;margin-bottom:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.demo-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.dgrp{padding:14px}.dh{font-weight:700;color:var(--hazard-d);text-transform:uppercase;letter-spacing:.5px;font-size:13px}.dgrp .dh{margin-bottom:8px}
.sumrow{cursor:pointer;transition:border-color .1s,background .1s}.sumrow:hover{border-color:var(--hazard-d);background:#fff}
.invalid{outline:2px solid var(--alert);outline-offset:2px}
.errlist{margin-top:14px;border:1px solid var(--alert);background:#FBEEEC;border-radius:11px;padding:10px 12px}
.errlist .el-h{font-weight:700;color:var(--alert);display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:14px}
.errlist .el-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;cursor:pointer;color:var(--ink);font-size:13px}
.errlist .el-row.el-static{cursor:default}
.errlist .el-step{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--hazard-d);background:#FBEAE1;border-radius:20px;padding:2px 8px;white-space:nowrap}
.errlist .el-msg{flex:1}.errlist .el-dot{color:var(--alert)}
.wtop{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
.pill.draft{background:#FBEAE1;color:var(--hazard-d)}
.dline{font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--line2);line-height:1.45}.dline:last-child{border-bottom:0}
.dq{font-weight:600}.da{color:var(--steel);white-space:pre-wrap}
.gal{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.gal img{width:66px;height:66px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--alert);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:50}
@media(max-width:560px){.two-col{grid-template-columns:1fr}.fc-actions{width:100%;justify-content:flex-end}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="bm"><i class="ti ti-helmet"></i></span> SiteCheck</div>
  <div class="topright" id="topright"></div>
</header>
<main class="main"><div id="app"><div class="loading"><span class="spin big"></span> Loading…</div></div></main>
<script src="/app.js"></script>
</body>
</html>
